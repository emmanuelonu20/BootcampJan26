<table>
    <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Author</th>
        <th>Author Email</th>
        <th>Genre</th>
        <th></th>
    </tr>

    <tr *ngFor="let book of books">
        <td>{{ book.id }}</td>
        <td>{{ book.title }}</td>
        <td>{{ book.author }}</td>
        <td>{{ book.author_email }}</td>
        <td>{{ book.genre }}</td>
        <td>
            <a [routerLink]="['/view-book', book.id]">View</a>
        </td>
    </tr>
</table>
