<div class="card">
    <div class="card-body">
      <h5 class="card-title">{{ task.title }}</h5>
      <p>{{ task.description }}</p>
      <hr>
      <h3>{{ task.task_date | date }}</h3>
      <hr>
      <h3>{{ task.category }}</h3>
      <hr>
      <h3>{{ task.priority_level }}</h3>
      <hr>
      <h3>{{ task.progress_level }}</h3>
    </div>
  </div>
