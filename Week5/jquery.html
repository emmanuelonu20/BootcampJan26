<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
</head>

<body>
    <p id="text1">Hello World 23</p>

    <div class="content">Hello World 33</div>

    <p class="content">Hello World 12</p>

    <button type="button" onclick="updateText()">Click Me</button>

    <script>
        function updateText() {
            // Get element by ID
            let text = $('#text1').html();
            console.log(text);
            $('#text1').html('<h1>I just got changed.</h1>').css('color', 'red');

            //Get element by class
            $('.content').css('background-color', 'yellow');
            debugger;

            //Get element by HTML tag name
            $('p').css('text-align', 'center');
        }
    </script>
</body>

</html>
